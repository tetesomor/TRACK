<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>run + lift tracker</title>
<meta name="description" content="track your runs, leg workouts, and progress" />
<meta name="theme-color" content="#0A0A0A" />

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="run+lift" />

<style>
  :root {
    --bg: #0A0A0A;
    --card: #141414;
    --card-border: #262626;
    --nav-bg: #0F0F0F;
    --border: #333333;
    --text: #EDEEEC;
    --text-dim: #8A8A8A;
    --text-dimmer: #707070;
    --text-body: #B5B5B5;
    --accent: #F5D90A;
    --accent-tint: rgba(245, 217, 10, 0.12);
    --accent-tint-border: rgba(245, 217, 10, 0.35);
    --radius: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .page {
    flex: 1;
    padding: 20px 16px 100px;
    overflow-y: auto;
  }

  h1.page-title {
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--card-border);
  }

  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
  }

  .big-stat-value {
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .big-stat-value.accent { color: var(--accent); }

  .big-stat-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .pill {
    display: inline-block;
    background: var(--accent-tint);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--accent-tint-border);
  }

  .divider {
    height: 1px;
    background: var(--card-border);
    margin: 10px 0;
  }

  button { font-family: inherit; }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    font-weight: 700;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
  }

  .btn-secondary {
    background: var(--text);
    color: var(--bg);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    font-weight: 600;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn-row > * { flex: 1; }

  .field { margin-bottom: 10px; }

  .field-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  .history-item {
    margin-bottom: 8px;
    padding: 12px;
  }

  .history-item-title { font-size: 14px; font-weight: 600; }
  .history-item-meta { font-size: 12px; color: var(--text-dim); }
  .history-item-value { font-weight: 700; font-variant-numeric: tabular-nums; }

  .set-row {
    display: flex;
    gap: 6px;
    align-items: flex-end;
    margin-bottom: 8px;
  }

  .set-row .field { flex: 1; margin-bottom: 0; }

  .remove-btn {
    background: none;
    border: none;
    color: var(--text-dimmer);
    font-size: 18px;
    cursor: pointer;
    padding-bottom: 10px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }

  .checkbox-box {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    flex-shrink: 0;
  }

  .checkbox-box.checked {
    border-color: var(--accent);
    background: var(--accent);
  }

  .checkbox-label { font-size: 13px; color: var(--text-body); }

  .sets-total-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .draft-exercise-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
  }

  .draft-exercise-row + .draft-exercise-row {
    border-top: 1px solid var(--card-border);
  }

  .note-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }

  .note-actions { display: flex; gap: 10px; }

  .note-actions button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }

  .note-body {
    font-size: 13px;
    color: var(--text-body);
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .session-history-exercise {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 13px;
  }

  .session-history-exercise .value { color: var(--text-body); font-variant-numeric: tabular-nums; }

  .run-sets-block {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--card-border);
  }

  .run-sets-block .label { font-size: 11px; color: var(--text-dimmer); margin-bottom: 6px; }

  .run-set-line {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-body);
    padding: 2px 0;
  }

  /* Bottom nav */
  .nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 420px;
    background: var(--nav-bg);
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    z-index: 10;
  }

  .nav-btn {
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text-dimmer);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
  }

  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; }

  .add-select-input-row {
    display: flex;
    gap: 8px;
  }

  .add-select-input-row button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="app">
  <div id="page-content" class="page"></div>
  <nav class="nav" id="bottom-nav"></nav>
</div>

<script src="app.js"></script>
</body>
</html>
